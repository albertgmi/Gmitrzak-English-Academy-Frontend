<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <p-button severity="secondary" label="Delete" icon="pi pi-trash" outlined (onClick)="deleteSelectedUsers()" [disabled]="!selectedUsers || !selectedUsers.length" />
  </ng-template>

  <ng-template #end>
    <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
  </ng-template>
</p-toolbar>

<p-table
  #dt
  [value]="users.value() || []"
  [rows]="10"
  [columns]="cols"
  [paginator]="true"
  [globalFilterFields]="['email', 'username', 'role']"
  [tableStyle]="{ 'min-width': '75rem' }"
  [(selection)]="selectedUsers"
  [rowHover]="true"
  dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
  [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
>
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">Users</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox />
      </th>
      <th style="min-width: 16rem">id</th>
      <th pSortableColumn="email" style="min-width: 8rem">
        email
        <p-sortIcon field="email" />
      </th>
      <th pSortableColumn="username" style="min-width:10rem">
        username
        <p-sortIcon field="username" />
      </th>
      <th pSortableColumn="role" style="min-width: 12rem">
        role
        <p-sortIcon field="role" />
      </th>
      <th style="min-width: 12rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-user>
    <tr>
      <td style="width: 3rem">
        <p-tableCheckbox [value]="user" />
      </td>
      <td style="min-width: 12rem">{{ user.id }}</td>
      <td style="min-width: 16rem">{{ user.email }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.role }}</td>
      <td>
        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editUser(user)" />
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteUser(user)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [(visible)]="userDialog" [style]="{ width: '450px' }" header="Update user" [modal]="true">
  <ng-template #content>
    <div class="flex flex-col gap-6">
      <div>
        <label for="email" class="block font-bold mb-3">email</label>
        <input type="text" pInputText id="email" [(ngModel)]="user.email" required autofocus fluid />
        <small class="text-red-500" *ngIf="submitted && !user.email">email is required.</small>
      </div>
      <div>
        <label for="username" class="block font-bold mb-3">username</label>
        <input type="text" pInputText id="username" [(ngModel)]="user.username" required autofocus fluid />
        <small class="text-red-500" *ngIf="submitted && !user.username">username is required.</small>
      </div>

      <div>
        <label for="role" class="block font-bold mb-3">Role</label>
        <p-select [(ngModel)]="user.role" inputId="role" [options]="roles" optionLabel="label" optionValue="label" placeholder="Select a Status" fluid />
      </div>

      <div>
        <label for="password" class="block font-bold mb-3">Password (optional)</label>
        <input type="password" pInputText id="password" [(ngModel)]="user.password" autofocus fluid />
      </div>

    </div>
  </ng-template>

  <ng-template #footer>
    <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button label="Save" icon="pi pi-check" (click)="saveUser()" />
  </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
