<div class="card" *ngIf="profile">

  <div class="flex items-center gap-4 mb-6">
    <p-button 
      [icon]="isAdmin ? 'pi pi-arrow-left' : 'pi pi-home'" 
      [outlined]="true" 
      [rounded]="true" 
      (click)="goBack()" 
    />

    <div class="relative">
      <img
        *ngIf="profile.avatarUrl && !avatarPreview"
        [src]="profile.avatarUrl"
        class="w-16 h-16 rounded-full object-cover border-2 border-surface-200"
        (error)="onAvatarError($event)"
      />
      <div
        *ngIf="!profile.avatarUrl && !avatarPreview"
        class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-white text-xl font-bold"
      >
        {{ initials }}
      </div>
      <img
        *ngIf="avatarPreview"
        [src]="avatarPreview"
        class="w-16 h-16 rounded-full object-cover border-2 border-primary"
      />
    </div>

    <div>
      <h2 class="text-2xl font-semibold m-0">{{ profile.username }}</h2>
      <p class="text-muted-color mt-1">{{ profile.email }}</p>
    </div>
    
    <div class="ml-auto" *ngIf="isAdmin">
      <p-button 
        [label]="editMode ? 'Cancel' : 'Edit Profile'" 
        [icon]="editMode ? 'pi pi-times' : 'pi pi-pencil'" 
        (click)="toggleEdit()" 
        [outlined]="!editMode"
        [severity]="editMode ? 'secondary' : 'primary'"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

    <div class="md:col-span-2 border-b border-surface-200 dark:border-surface-700 pb-6">
      <label class="block font-bold mb-3">Profile Picture</label>
      
      <div class="flex items-center gap-4">
        <div *ngIf="isAdmin || isOwnProfile" class="flex flex-col gap-3">
          <input #fileInput type="file" accept=".jpg,.jpeg,.png" class="hidden" (change)="onFileSelected($event)" />
          
          <div class="flex gap-2">
            <p-button
              *ngIf="!selectedFile"
              label="Change Photo"
              icon="pi pi-camera"
              [outlined]="true"
              size="small"
              (click)="fileInput.click()"
            />
            
            <ng-container *ngIf="selectedFile">
              <p-button label="Save Avatar" icon="pi pi-check" severity="success" size="small" (click)="saveAvatar()" />
              <p-button label="Discard" icon="pi pi-times" severity="secondary" [outlined]="true" size="small" (click)="clearSelectedFile()" />
            </ng-container>
          </div>
          <small class="text-muted-color">Allowed: JPG, PNG. Max 2MB.</small>
          <p-message *ngIf="avatarError" severity="error" [text]="avatarError" />
        </div>
      </div>
    </div>

    <div>
      <label class="block font-bold mb-2">Username</label>
      <div class="p-3 bg-surface-100 dark:bg-surface-700 rounded-md">{{ profile.username }}</div>
    </div>

    <div>
      <label class="block font-bold mb-2">Email</label>
      <div class="p-3 bg-surface-100 dark:bg-surface-700 rounded-md">{{ profile.email }}</div>
    </div>

    <div>
      <label class="block font-bold mb-2">English Level</label>
      <p-select *ngIf="editMode" [(ngModel)]="profile.englishLevel" [options]="englishLevels" optionLabel="label" optionValue="value" fluid />
      <div *ngIf="!editMode" class="p-3 bg-surface-100 dark:bg-surface-700 rounded-md">{{ profile.englishLevel || '—' }}</div>
    </div>

    <div>
      <label class="block font-bold mb-2">Current Semester</label>
      <p-inputNumber *ngIf="editMode" [(ngModel)]="profile.currentSemester" [min]="1" [max]="20" fluid />
      <div *ngIf="!editMode" class="p-3 bg-surface-100 dark:bg-surface-700 rounded-md">{{ profile.currentSemester || '—' }}</div>
    </div>
  </div>

  <div class="mb-6">
    <label class="block font-bold mb-4">Completed Semesters</label>
    <div class="grid grid-cols-5 md:grid-cols-10 gap-2">
      <div *ngFor="let s of semesters" class="flex flex-col items-center gap-1">
        <span class="text-sm text-muted-color">{{ s }}</span>
        <p-checkbox [(ngModel)]="$any(profile)['semester' + s]" [binary]="true" [disabled]="!editMode" />
      </div>
    </div>
  </div>

  <div class="flex gap-3" *ngIf="editMode">
    <p-button label="Save Changes" icon="pi pi-check" (click)="save()" />
    <p-button label="Cancel" icon="pi pi-times" severity="secondary" outlined (click)="toggleEdit()" />
  </div>

</div>
<p-toast />
