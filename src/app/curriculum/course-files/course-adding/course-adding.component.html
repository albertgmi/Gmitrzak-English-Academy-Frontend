<p-toast />

<div class="card">
    <div class="flex items-center gap-3 mb-6">
        <p-button icon="pi pi-arrow-left" severity="secondary" outlined [routerLink]="['/curriculum/courses']" />
        <h2 class="text-2xl font-bold m-0">Add New Course</h2>
    </div>

    <div class="grid grid-cols-1 gap-6">
        <div class="flex flex-col gap-5 max-w-3xl">
            <div class="field">
                <label for="name" class="block font-bold mb-2">Name</label>
                <input type="text" pInputText id="name" [(ngModel)]="course.name" class="w-full" placeholder="Enter course name" />
                <small class="p-error" *ngIf="submitted && !course.name">Name is required.</small>
            </div>

            <div class="field">
                <label for="description" class="block font-bold mb-2">Description</label>
                <textarea pTextarea id="description" [(ngModel)]="course.description" rows="5" class="w-full" placeholder="Enter course description"></textarea>
            </div>

            <div class="flex items-center gap-3">
                <p-checkbox [(ngModel)]="course.isHidden" [binary]="true" inputId="isHidden" />
                <label for="isHidden" class="font-bold">Hidden from students</label>
            </div>
        </div>
    </div>

    <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-surface-200">
        <p-button label="Cancel" severity="secondary" outlined [routerLink]="['/curriculum/courses']" />
        <p-button label="Create Course" icon="pi pi-check" (onClick)="saveCourse()" />
    </div>
</div>
