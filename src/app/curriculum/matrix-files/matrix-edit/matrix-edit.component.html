<p-toast />

<div class="card" *ngIf="editedMatrix() as matrix">

  <div class="flex items-center gap-3 mb-6">
    <p-button icon="pi pi-arrow-left" severity="secondary" outlined (onClick)="goBack()" />
    <h2 class="text-2xl font-bold m-0">Edit Matrix: {{ matrix.name }}</h2>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Left: fields -->
    <div class="flex flex-col gap-5">

      <div>
        <label for="m-name" class="block font-bold mb-2">Name <span class="text-red-500">*</span></label>
        <input type="text" pInputText id="m-name" [(ngModel)]="matrix.name" fluid />
        <small class="text-red-500" *ngIf="submitted && !matrix.name?.trim()">Name is required.</small>
      </div>

      <div>
        <label for="m-desc" class="block font-bold mb-2">Description</label>
        <textarea pTextarea id="m-desc" [(ngModel)]="matrix.description" rows="4" fluid></textarea>
      </div>

      <div>
        <label class="block font-bold mb-3">Refresh Interval</label>
        <div class="flex flex-wrap gap-2 mb-3">
          <p-button *ngFor="let p of intervalPresets"
            [label]="p.label"
            [outlined]="matrix.refreshIntervalDays !== p.value"
            size="small"
            (onClick)="matrix.refreshIntervalDays = p.value" />
        </div>
        <div class="flex items-center gap-3">
          <p-inputNumber [(ngModel)]="matrix.refreshIntervalDays"
            [min]="1" [max]="365" suffix=" days"
            inputStyleClass="w-28" />
          <span class="text-sm text-muted-color">or enter custom value</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <p-checkbox [(ngModel)]="matrix.isHidden" [binary]="true" inputId="m-hidden" />
        <label for="m-hidden" class="font-bold">Hidden from students</label>
      </div>

    </div>

    <!-- Right: course assignment -->
    <div class="bg-surface-50 dark:bg-surface-800 p-5 rounded-xl">
      <h3 class="text-lg font-bold mb-4">Assigned Courses</h3>

      <div class="flex flex-col gap-2 mb-4">
        <div *ngFor="let c of matrix.courses"
          class="flex items-center justify-between bg-white dark:bg-surface-900 p-3 rounded-lg shadow-sm">
          <span class="flex items-center gap-2">
            <i class="pi pi-book text-primary"></i>
            {{ c.name }}
          </span>
          <p-button icon="pi pi-times" severity="danger" [text]="true"
            (onClick)="removeCourse(c)" pTooltip="Remove" />
        </div>
        <div *ngIf="!matrix.courses?.length"
          class="text-center text-muted-color py-6 italic">
          Not assigned to any course yet.
        </div>
      </div>

      <div class="flex gap-2">
        <p-select [options]="availableCourses()" [ngModel]="selectedCourseToAdd()"
          (ngModelChange)="selectedCourseToAdd.set($event)"
          optionLabel="name" placeholder="Select course…" class="flex-1" />
        <p-button icon="pi pi-plus" [disabled]="!selectedCourseToAdd()"
          (onClick)="assignCourse()" pTooltip="Assign" />
      </div>
    </div>

  </div>

  <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-surface-200 dark:border-surface-700">
    <p-button label="Cancel" severity="secondary" outlined (onClick)="goBack()" />
    <p-button label="Save Changes" icon="pi pi-check" (onClick)="save()" />
  </div>

</div>
