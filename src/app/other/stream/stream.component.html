<p-toast />
<p-confirmDialog />

<div class="card">

  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Stream</h2>
      <p class="text-muted-color mt-1 m-0">System command history per user</p>
    </div>
    <p-button *ngIf="!showAddForm()" label="Add Entry" icon="pi pi-plus"
      (onClick)="openAddForm()" />
  </div>

  <!-- Add form -->
  <div *ngIf="showAddForm()"
    class="bg-surface-50 dark:bg-surface-800 rounded-xl p-6 mb-6 border border-surface-200 dark:border-surface-700">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-lg font-semibold m-0">New Stream Entry</h3>
      <p-button icon="pi pi-times" severity="secondary" [text]="true" (onClick)="closeAddForm()" />
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <div>
        <label class="block font-bold mb-2">User <span class="text-red-500">*</span></label>
        <p-select [options]="users()" [ngModel]="newUserId()"
          (ngModelChange)="newUserId.set($event)"
          optionLabel="label" optionValue="id"
          placeholder="Select user" [filter]="true" fluid />
        <small class="text-red-500" *ngIf="submitted && !newUserId()">Required.</small>
      </div>
      <div>
        <label class="block font-bold mb-2">Command <span class="text-red-500">*</span></label>
        <input pInputText type="text"
          [ngModel]="newCommand()" (ngModelChange)="newCommand.set($event)"
          placeholder="e.g. FLASHCARD_ADDED" fluid />
        <small class="text-red-500" *ngIf="submitted && !newCommand().trim()">Required.</small>
      </div>
      <div>
        <label class="block font-bold mb-2">Payload</label>
        <input pInputText type="text"
          [ngModel]="newPayload()" (ngModelChange)="newPayload.set($event)"
          placeholder="Optional JSON or text..." fluid />
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <p-button label="Add" icon="pi pi-check" [loading]="saving()" (onClick)="addEntry()" />
      <p-button label="Cancel" severity="secondary" outlined (onClick)="closeAddForm()" />
    </div>
  </div>

  <!-- Toolbar -->
  <p-toolbar styleClass="mb-4">
    <ng-template #start>
      <p-select [options]="allUsers()" [ngModel]="filterUserId()"
        (ngModelChange)="filterUserId.set($event)"
        optionLabel="label" optionValue="id"
        placeholder="Filter by user" [showClear]="true" styleClass="w-52" />
      <p-button *ngIf="selectedEntries().length"
        label="Delete selected ({{ selectedEntries().length }})"
        icon="pi pi-trash" severity="danger" outlined class="ml-3"
        (onClick)="confirmDeleteSelected()" />
    </ng-template>
    <ng-template #end>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
      </p-iconfield>
      <p-button icon="pi pi-refresh" severity="secondary" outlined class="ml-2"
        (onClick)="reload()" pTooltip="Refresh" />
    </ng-template>
  </p-toolbar>

  <p-table #dt
    [value]="filteredEntries()"
    [loading]="entries.isLoading()"
    [(selection)]="selectedEntries"
    dataKey="id"
    [rows]="20" [paginator]="true" [rowHover]="true"
    [globalFilterFields]="['username', 'command', 'payload']"
    [tableStyle]="{'min-width': '50rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[20, 50, 100]">

    <ng-template #header>
      <tr>
        <th style="width: 3rem"><p-tableHeaderCheckbox /></th>
        <th pSortableColumn="executedAt" style="width: 12rem">
          Time <p-sortIcon field="executedAt" />
        </th>
        <th pSortableColumn="username" style="width: 12rem">
          User <p-sortIcon field="username" />
        </th>
        <th pSortableColumn="command">Command <p-sortIcon field="command" /></th>
        <th>Payload</th>
        <th style="width: 5rem"></th>
      </tr>
    </ng-template>

    <ng-template #body let-e>
      <tr>
        <td><p-tableCheckbox [value]="e" /></td>
        <td class="text-xs text-muted-color font-mono">
          {{ e.executedAt | date:'d MMM yyyy HH:mm:ss' }}
        </td>
        <td>
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-xs flex-shrink-0">
              {{ e.username[0]?.toUpperCase() }}
            </div>
            <span class="text-sm font-semibold">{{ e.username }}</span>
          </div>
        </td>
        <td>
          <span class="font-mono text-sm bg-surface-100 dark:bg-surface-700 px-2 py-1 rounded">
            {{ e.command }}
          </span>
        </td>
        <td class="text-muted-color text-sm max-w-xs truncate">
          {{ e.payload || '—' }}
        </td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
            size="small" (onClick)="confirmDelete(e)" pTooltip="Delete" />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="text-center text-muted-color py-10">
          <i class="pi pi-server text-4xl block mb-3"></i>
          No stream entries found.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
