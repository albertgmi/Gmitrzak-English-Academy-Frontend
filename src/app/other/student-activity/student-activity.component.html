<div class="grid grid-cols-12 gap-6">

  <div class="col-span-12 lg:col-span-6 xl:col-span-3">
    <div class="card mb-0">
      <div class="flex justify-between mb-4">
        <div>
          <span class="block text-muted-color font-medium mb-2">Total Students</span>
          <div class="text-surface-900 dark:text-surface-0 font-bold text-2xl">
            <p-skeleton *ngIf="loading()" width="3rem" height="2rem" />
            <ng-container *ngIf="!loading()">{{ students().length }}</ng-container>
          </div>
        </div>
        <div class="flex items-center justify-center bg-blue-100 dark:bg-blue-400/10 rounded-xl w-12 h-12">
          <i class="pi pi-users text-blue-500 text-xl"></i>
        </div>
      </div>
      <span class="text-muted-color">registered accounts</span>
    </div>
  </div>

  <div class="col-span-12 lg:col-span-6 xl:col-span-3">
    <div class="card mb-0">
      <div class="flex justify-between mb-4">
        <div>
          <span class="block text-muted-color font-medium mb-2">Online Now</span>
          <div class="text-surface-900 dark:text-surface-0 font-bold text-2xl">
            <p-skeleton *ngIf="loading()" width="3rem" height="2rem" />
            <ng-container *ngIf="!loading()">{{ onlineCount() }}</ng-container>
          </div>
        </div>
        <div class="flex items-center justify-center bg-green-100 dark:bg-green-400/10 rounded-xl w-12 h-12">
          <i class="pi pi-circle-fill text-green-500 text-xl"></i>
        </div>
      </div>
      <span class="text-primary font-medium">live</span>
      <span class="text-muted-color"> · updates every 30s</span>
    </div>
  </div>

  <div class="col-span-12">
    <div class="card mb-0">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <h3 class="font-semibold text-xl m-0">Student Activity</h3>
        <span class="p-input-icon-left w-full sm:w-72">
          <input
            type="text"
            pInputText
            class="w-full"
            placeholder="Search student..."
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)" />
        </span>
      </div>

      <div *ngIf="loading()" class="flex flex-col gap-3">
        <div *ngFor="let i of [1,2,3,4,5]" class="flex items-center gap-3 p-3 rounded-xl">
          <p-skeleton shape="circle" size="2.5rem" />
          <div class="flex-1">
            <p-skeleton width="8rem" height="1rem" styleClass="mb-2" />
            <p-skeleton width="5rem" height="0.75rem" />
          </div>
        </div>
      </div>

      <div *ngIf="!loading()" class="flex flex-col gap-2">
        <div *ngFor="let s of filteredStudents()"
          class="flex items-center gap-3 p-3 rounded-xl bg-surface-50 dark:bg-surface-800 hover:bg-surface-100 dark:hover:bg-surface-700 transition-colors">

          <div class="relative flex-shrink-0">
            <app-avatar
              [username]="s.username"
              [avatarUrl]="s.avatarUrl"
              customClass="w-10 h-10" />
            <span
              class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-surface-50 dark:border-surface-800"
              [ngClass]="s.isOnline ? 'bg-green-500' : 'bg-surface-300 dark:bg-surface-600'">
            </span>
          </div>

          <div class="flex-1 min-w-0">
            <div class="font-semibold text-surface-900 dark:text-surface-0 truncate">
              {{ s.username }}
            </div>
            <div class="text-xs text-muted-color">
              Last login: {{ lastLoginLabel(s) }}
            </div>
          </div>

          <p-tag
            [severity]="s.isOnline ? 'success' : 'secondary'"
            [value]="lastActiveLabel(s)"
            styleClass="text-xs flex-shrink-0" />
        </div>

        <div *ngIf="!filteredStudents().length" class="text-center py-10 text-muted-color text-sm">
          <i class="pi pi-search text-2xl block mb-2 opacity-50"></i>
          No students found.
        </div>
      </div>
    </div>
  </div>

</div>
