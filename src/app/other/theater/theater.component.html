<p-toast />
<p-confirmDialog />

<div class="card">

  <p-toolbar styleClass="mb-6">
    <ng-template #start>
      <span class="text-xl font-semibold">Theater</span>
    </ng-template>
    <ng-template #end>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
      </p-iconfield>
      <p-button label="Add Item" icon="pi pi-plus" class="ml-3" (onClick)="openNew()" />
      <p-button icon="pi pi-refresh" severity="secondary" outlined class="ml-2"
        (onClick)="reload()" pTooltip="Refresh" />
    </ng-template>
  </p-toolbar>

  <p-table #dt [value]="items.value() || []" [loading]="items.isLoading()"
    [rows]="10" [paginator]="true" [rowHover]="true"
    [globalFilterFields]="['title', 'description', 'mediaType', 'level']"
    [tableStyle]="{'min-width': '55rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} items"
    [showCurrentPageReport]="true">

    <ng-template #header>
      <tr>
        <th style="width: 5rem"></th>
        <th pSortableColumn="title">Title <p-sortIcon field="title" /></th>
        <th style="width: 9rem">Type</th>
        <th style="width: 7rem">Level</th>
        <th style="width: 7rem">Duration</th>
        <th style="width: 7rem">Status</th>
        <th style="width: 9rem">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>
          <div class="w-12 h-12 rounded-lg overflow-hidden bg-surface-100 dark:bg-surface-700
            flex items-center justify-center flex-shrink-0">
            <img *ngIf="item.thumbnailUrl" [src]="item.thumbnailUrl"
              [alt]="item.title" class="w-full h-full object-cover"
              (error)="$any($event.target).style.display='none'" />
            <i *ngIf="!item.thumbnailUrl" class="pi pi-video text-muted-color"></i>
          </div>
        </td>
        <td>
          <div class="font-semibold text-surface-900 dark:text-surface-0">{{ item.title }}</div>
          <div class="text-xs text-muted-color mt-0.5 truncate max-w-xs">
            {{ item.description || '—' }}
          </div>
          <a *ngIf="item.url" [href]="item.url" target="_blank"
            class="text-xs text-primary hover:underline mt-0.5 block truncate max-w-xs">
            {{ item.url }}
          </a>
        </td>
        <td>
          <p-tag [value]="item.mediaType" [severity]="mediaTypeSeverity(item.mediaType)" />
        </td>
        <td>
          <span class="text-sm font-mono" *ngIf="item.level">{{ item.level }}</span>
          <span class="text-muted-color text-sm" *ngIf="!item.level">—</span>
        </td>
        <td class="text-sm text-muted-color">
          {{ item.durationMinutes ? item.durationMinutes + ' min' : '—' }}
        </td>
        <td>
          <p-tag [severity]="item.isActive ? 'success' : 'secondary'"
            [value]="item.isActive ? 'Active' : 'Hidden'"
            class="cursor-pointer" (click)="toggleActive(item)" pTooltip="Click to toggle" />
        </td>
        <td>
          <p-button icon="pi pi-pencil" [rounded]="true" outlined class="mr-2"
            (onClick)="openEdit(item)" pTooltip="Edit" />
          <p-button icon="pi pi-trash" severity="danger" [rounded]="true" outlined
            (onClick)="confirmDelete(item)" pTooltip="Delete" />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="text-center text-muted-color py-10">
          <i class="pi pi-video text-4xl block mb-3"></i>
          No theater items yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Add/Edit dialog -->
<p-dialog [(visible)]="showDialog" [style]="{width: '560px', height: '550px'}"
  [header]="isEdit() ? 'Edit Item' : 'Add Theater Item'"
  [modal]="true">
  <ng-template #content>
    <div class="flex flex-col gap-4" *ngIf="form() as f">

      <div>
        <label class="block font-bold mb-2">Title <span class="text-red-500">*</span></label>
        <input pInputText type="text" [(ngModel)]="f.title" placeholder="e.g. Breaking Bad S01" fluid />
        <small class="text-red-500" *ngIf="submitted && !f.title?.trim()">Required.</small>
      </div>

      <div>
        <label class="block font-bold mb-2">URL <span class="text-red-500">*</span></label>
        <input pInputText type="text" [(ngModel)]="f.url"
          placeholder="https://youtube.com/..." fluid />
        <small class="text-red-500" *ngIf="submitted && !f.url?.trim()">Required.</small>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block font-bold mb-2">Type</label>
          <p-select [options]="mediaTypes" optionLabel="label" optionValue="value"
            [(ngModel)]="f.mediaType" fluid />
        </div>
        <div>
          <label class="block font-bold mb-2">Level</label>
          <p-select [options]="levels" optionLabel="label" optionValue="value"
            [(ngModel)]="f.level" placeholder="Any" fluid />
        </div>
        <div>
          <label class="block font-bold mb-2">Duration (min)</label>
          <p-inputNumber [(ngModel)]="f.durationMinutes" [min]="0" fluid />
        </div>
      </div>

      <div>
        <label class="block font-bold mb-2">Thumbnail URL</label>
        <input pInputText type="text" [(ngModel)]="f.thumbnailUrl"
          placeholder="https://..." fluid />
      </div>

      <div *ngIf="isEdit()" class="flex items-center gap-3">
        <p-checkbox [(ngModel)]="f.isActive" [binary]="true" inputId="active" />
        <label for="active" class="font-bold">Active (visible in repertoire)</label>
      </div>

      <div>
        <label class="block font-bold mb-2">Description</label>
        <textarea pTextarea [(ngModel)]="f.description"
          placeholder="Brief description..." rows="3" fluid></textarea>
      </div>

    </div>
  </ng-template>
  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" outlined (onClick)="showDialog.set(false)" />
    <p-button label="Save" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
  </ng-template>
</p-dialog>
