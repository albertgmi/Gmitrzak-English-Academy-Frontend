<p-toast />
<div class="card">
  <h2 class="text-2xl font-bold m-0 mb-6 text-surface-900 dark:text-surface-0">Grades</h2>

  <div *ngIf="loading()" class="text-center py-10 text-muted-color">
    <i class="pi pi-spin pi-spinner text-3xl"></i>
  </div>

  <p-table *ngIf="!loading()" [value]="grades()" [rows]="15"
    [paginator]="grades().length > 15" [rowHover]="true"
    [globalFilterFields]="['category', 'notes']"
    [tableStyle]="{'min-width': '35rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} grades"
    [showCurrentPageReport]="true">
    <ng-template #header>
      <tr>
        <th pSortableColumn="gradeDate">Date <p-sortIcon field="gradeDate" /></th>
        <th pSortableColumn="category">Category <p-sortIcon field="category" /></th>
        <th pSortableColumn="percentage">Score <p-sortIcon field="percentage" /></th>
        <th>Notes</th>
      </tr>
    </ng-template>
    <ng-template #body let-g>
      <tr>
        <td>{{ g.gradeDate | date:'d MMM yyyy' }}</td>
        <td>
          <p-tag [value]="g.category" severity="info" />
        </td>
        <td>
          <p-tag [value]="g.percentage + '%'" [severity]="gradeSeverity(g.percentage)" />
        </td>
        <td class="text-muted-color">{{ g.notes || '—' }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="text-center text-muted-color py-8">
          <i class="pi pi-star text-3xl block mb-2"></i>
          No grades yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
