<p-toast />
<div class="card">
  <div class="mb-6">
    <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Memories</h2>
    <p class="text-muted-color mt-1 m-0">Your mnemonics and associations</p>
  </div>

  <p-table #dt [value]="memories.value() || []" [loading]="memories.isLoading()"
    [rows]="15" [paginator]="true" [rowHover]="true"
    [globalFilterFields]="['content', 'notes']"
    [tableStyle]="{'min-width': '30rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} memories"
    [showCurrentPageReport]="true">

    <ng-template #caption>
      <div class="flex items-center justify-between flex-wrap gap-3">
        <span class="text-sm text-muted-color flex-shrink-0">{{ memories.value()?.length || 0 }} memories</span>
        <p-iconfield class="w-full sm:w-auto">
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." class="w-full" />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Content</th>
        <th style="width: 18rem">Notes</th>
      </tr>
    </ng-template>

    <ng-template #body let-m>
      <tr>
        <td class="font-semibold text-surface-900 dark:text-surface-0">{{ m.content }}</td>

        <td style="width: 18rem">

          <div class="flex items-center gap-1" *ngIf="editingId() !== m.id">

            <ng-container *ngIf="m.notes; else emptyNote">
              <span
                class="flex-1 text-sm truncate transition-all"
                [class.blur-sm]="!isRevealed(m.id)"
                [class.select-none]="!isRevealed(m.id)"
                [class.text-muted-color]="!isRevealed(m.id)">
                {{ m.notes }}
              </span>
              <button pButton type="button"
                [icon]="isRevealed(m.id) ? 'pi pi-eye-slash' : 'pi pi-eye'"
                class="p-button-rounded p-button-text p-button-sm"
                (click)="toggleReveal(m.id, $event)"
                [pTooltip]="isRevealed(m.id) ? 'Hide' : 'Show'"></button>
              <button pButton type="button" icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-sm"
                (click)="startEdit(m, $event)"
                pTooltip="Edit"></button>
            </ng-container>

            <ng-template #emptyNote>
              <span
                class="flex-1 text-sm text-muted-color italic cursor-pointer hover:underline"
                (click)="startEdit(m)">
                Add note
              </span>
              <button pButton type="button" icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-sm"
                (click)="startEdit(m, $event)"
                pTooltip="Add note"></button>
            </ng-template>

          </div>

          <div class="flex items-center gap-1" *ngIf="editingId() === m.id">
            <input pInputText type="text"
              [id]="'note-input-' + m.id"
              class="flex-1 text-sm"
              [ngModel]="editValue()"
              (ngModelChange)="editValue.set($event)"
              (keyup.enter)="saveNote(m.id)"
              (keyup.escape)="cancelEdit(m.id)"
              placeholder="Add note" />
            <button pButton type="button" icon="pi pi-check"
              class="p-button-rounded p-button-text p-button-sm p-button-success"
              [loading]="savingId() === m.id"
              (click)="saveNote(m.id)"
              pTooltip="Save"></button>
            <button pButton type="button" icon="pi pi-times"
              class="p-button-rounded p-button-text p-button-sm p-button-danger"
              (click)="cancelEdit(m.id, $event)"
              pTooltip="Cancel"></button>
          </div>

        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="2" class="text-center text-muted-color py-8">
          <i class="pi pi-lightbulb text-4xl block mb-2"></i>
          No memories yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
