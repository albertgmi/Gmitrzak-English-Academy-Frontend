<p-toast />
<div class="card">
  <div class="mb-6">
    <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Memories</h2>
    <p class="text-muted-color mt-1 m-0">Your mnemonics and associations</p>
  </div>

  <p-table #dt [value]="memories.value() || []" [loading]="memories.isLoading()"
    [rows]="15" [paginator]="true" [rowHover]="true"
    [globalFilterFields]="['content', 'notes']"
    [tableStyle]="{'min-width': '30rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} memories"
    [showCurrentPageReport]="true">

    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-sm text-muted-color">{{ memories.value()?.length || 0 }} memories</span>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Content</th>
        <th style="width: 14rem">Notes</th>
      </tr>
    </ng-template>

    <ng-template #body let-m>
      <tr>
        <td class="font-semibold text-surface-900 dark:text-surface-0">{{ m.content }}</td>
        <td class="text-muted-color text-sm">{{ m.notes || '—' }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="2" class="text-center text-muted-color py-8">
          <i class="pi pi-lightbulb text-4xl block mb-2"></i>
          No memories yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
