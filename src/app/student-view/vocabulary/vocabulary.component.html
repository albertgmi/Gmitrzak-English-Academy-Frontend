<p-toast />
<div class="card">
  <div class="mb-6">
    <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Vocabulary</h2>
    <p class="text-muted-color mt-1 m-0">Your word dictionary</p>
  </div>

  <p-table #dt [value]="flashcards.value() || []" [loading]="flashcards.isLoading()"
    [rows]="20" [paginator]="true" [rowHover]="true"
    [globalFilterFields]="['front', 'back', 'category']"
    [tableStyle]="{'min-width': '30rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} words"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[20, 50, 100]">

    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-sm text-muted-color">{{ flashcards.value()?.length || 0 }} words</span>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="front">Polish <p-sortIcon field="front" /></th>
        <th pSortableColumn="back">English <p-sortIcon field="back" /></th>
        <th pSortableColumn="category" style="width: 10rem">Category <p-sortIcon field="category" /></th>
      </tr>
    </ng-template>

    <ng-template #body let-card>
      <tr>
        <td class="font-semibold text-surface-900 dark:text-surface-0">{{ card.front }}</td>
        <td class="text-muted-color">{{ card.back }}</td>
        <td><p-tag [value]="card.category" severity="info" /></td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="text-center text-muted-color py-8">
          <i class="pi pi-book text-4xl block mb-2"></i>
          No words yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
