<p-toast />
<div class="card">
  <h2 class="text-2xl font-bold m-0 mb-6">Activity Points</h2>
  <div *ngIf="loading()" class="text-center py-10 text-muted-color">
    <i class="pi pi-spin pi-spinner text-3xl"></i>
  </div>
  <div *ngIf="!loading() && data() as d">
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-primary/10 rounded-2xl p-4 sm:p-6 text-center">
        <div class="text-3xl sm:text-4xl font-bold text-primary">{{ d.totalAllTime }}</div>
        <div class="text-xs sm:text-sm text-muted-color mt-1">All Time</div>
      </div>
      <div class="bg-surface-50 dark:bg-surface-800 rounded-2xl p-4 sm:p-6 text-center">
        <div class="text-3xl sm:text-4xl font-bold">{{ d.totalThisWeek }}</div>
        <div class="text-xs sm:text-sm text-muted-color mt-1">This Week</div>
      </div>
      <div class="bg-surface-50 dark:bg-surface-800 rounded-2xl p-4 sm:p-6 text-center">
        <div class="text-3xl sm:text-4xl font-bold">{{ d.totalLastWeek }}</div>
        <div class="text-xs sm:text-sm text-muted-color mt-1">Last Week</div>
      </div>
    </div>
    <div *ngIf="groupedHistory().length === 0" class="text-center text-muted-color py-12 border border-dashed rounded-2xl">
      <i class="pi pi-chart-line text-3xl block mb-3"></i>
      No activity points yet.
    </div>
    <div *ngFor="let group of groupedHistory(); trackBy: trackByDate" class="mb-4">
      <div (click)="toggleDay(group.dateKey)" class="cursor-pointer rounded-2xl border border-surface-200 dark:border-surface-700 bg-white dark:bg-surface-900 shadow-sm hover:shadow-md transition-all overflow-hidden">
        <div class="flex items-center justify-between p-5 flex-wrap gap-3">
          <div class="flex items-center gap-4 min-w-0">
            <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
              <i class="pi text-primary text-lg" [ngClass]="expandedDays()[group.dateKey] ? 'pi-calendar-minus' : 'pi-calendar-plus'"></i>
            </div>
            <div class="min-w-0">
              <div class="font-bold text-lg truncate">{{ group.date | date:'EEEE, d MMMM yyyy' }}</div>
              <div class="text-sm text-muted-color">{{ group.items.length }} activities</div>
            </div>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="text-2xl font-bold text-primary">+{{ group.total }}</div>
            <div class="text-xs text-muted-color">points</div>
          </div>
        </div>
        <div *ngIf="expandedDays()[group.dateKey]" class="border-t border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-950">
          <div *ngFor="let item of group.items; let last = last" class="flex items-center justify-between px-5 py-4" [class.border-b]="!last">
            <div class="flex items-center gap-3 flex-1">
              <div class="w-3 h-3 rounded-full bg-primary"></div>
              <span class="text-sm">{{ item.reason || 'No reason' }}</span>
            </div>
            <div class="font-bold text-primary ml-4">+{{ item.points }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
