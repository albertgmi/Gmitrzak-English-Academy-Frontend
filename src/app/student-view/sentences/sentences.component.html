<p-toast />
<div class="card">
  <div class="mb-6">
    <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Sentences</h2>
    <p class="text-muted-color mt-1 m-0">Your sentence collection</p>
  </div>

  <p-table #dt [value]="sentences.value() || []" [loading]="sentences.isLoading()"
    [rows]="15" [paginator]="true" [rowHover]="true"
    [globalFilterFields]="['content', 'translation', 'notes']"
    [tableStyle]="{'min-width': '40rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} sentences"
    [showCurrentPageReport]="true">

    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-sm text-muted-color">{{ sentences.value()?.length || 0 }} sentences</span>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Sentence</th>
        <th>Translation</th>
        <th style="width: 12rem">Notes</th>
      </tr>
    </ng-template>

    <ng-template #body let-s>
      <tr>
        <td class="font-semibold text-surface-900 dark:text-surface-0">{{ s.content }}</td>
        <td class="text-muted-color">{{ s.translation }}</td>
        <td class="text-muted-color text-sm">{{ s.notes || '—' }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="text-center text-muted-color py-8">
          <i class="pi pi-align-left text-4xl block mb-2"></i>
          No sentences yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
