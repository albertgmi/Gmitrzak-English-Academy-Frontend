<p-toast />
<div class="card">
  <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Sentences</h2>
      <p class="text-muted-color mt-1 m-0">Your personal sentence collection and flashcards</p>
    </div>
  </div>

  <p-table #dt [value]="currentData" [loading]="isLoading"
    [rows]="15" [paginator]="true" [rowHover]="true"
    [globalFilterFields]="['content', 'translation', 'notes']"
    [tableStyle]="{'min-width': '40rem'}"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} sentences"
    [showCurrentPageReport]="true">

    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-sm text-muted-color">{{ currentData.length }} sentences</span>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="content">Sentence <p-sortIcon field="content" /></th>
        <th pSortableColumn="translation">Translation <p-sortIcon field="translation" /></th>
        <th pSortableColumn="notes" style="width: 14rem">Notes <p-sortIcon field="notes" /></th>
      </tr>
    </ng-template>

    <ng-template #body let-s>
      <tr>
        <td class="font-semibold text-surface-900 dark:text-surface-0">{{ s.content }}</td>
        <td class="text-muted-color">{{ s.translation }}</td>
        <td>
          <span class="text-muted-color text-sm">{{ s.notes || '—' }}</span>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="text-center text-muted-color py-8">
          <i class="pi pi-align-left text-4xl block mb-2"></i>
          No sentences found.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
