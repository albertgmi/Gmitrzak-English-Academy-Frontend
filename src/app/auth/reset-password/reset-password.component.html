<div class="p-d-flex p-jc-center p-ai-center" style="height: 100vh;">
  <div class="p-shadow-3 p-p-4" style="width: 400px;">
    <h2 class="p-text-center">Reset Password</h2>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="p-field">
        <label for="password">New Password</label>
        <p-password id="password" formControlName="password" [feedback]="true"></p-password>
      </div>
      <div class="p-field">
        <button pButton type="submit" label="Reset Password" [disabled]="resetForm.invalid"></button>
      </div>
    </form>
    <p-toast></p-toast>
  </div>
</div>
