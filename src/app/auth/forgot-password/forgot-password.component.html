<div class="p-d-flex p-jc-center p-ai-center" style="height: 100vh;">
  <div class="p-shadow-3 p-p-4" style="width: 400px;">
    <h2 class="p-text-center">Forgot Password</h2>
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="p-field">
        <label for="email">Email</label>
        <input pInputText id="email" formControlName="email" />
      </div>
      <div class="p-field">
        <button pButton type="submit" label="Send Reset Link" [disabled]="forgotForm.invalid"></button>
      </div>
    </form>
    <p-toast></p-toast>
  </div>
</div>
