<p-toast />

<div *ngIf="!activeStudent()" class="card text-center py-16">
  <i class="pi pi-user text-5xl text-muted-color block mb-4"></i>
  <h3 class="text-xl font-semibold mb-2">No student selected</h3>
  <p-button label="Switch Client" icon="pi pi-users" (onClick)="goToSwitchClient()" />
</div>

<div *ngIf="activeStudent() as student" class="card">
  <div class="flex items-center gap-3 mb-6">
    <app-avatar 
      [username]="student.username" 
      [avatarUrl]="$any(student).avatarUrl" 
      customClass="w-10 h-10 text-base"
      fallbackBgClass="bg-primary text-white" />

    <div class="flex-1">
      <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Agenda</h2>
      <p class="text-muted-color mt-0.5 m-0">Weekly targets for {{ student.username }}</p>
    </div>
    <p-button label="Switch" icon="pi pi-arrows-h" severity="secondary" outlined
      size="small" (onClick)="goToSwitchClient()" />
  </div>

  <div *ngIf="loading()" class="text-center py-10 text-muted-color">
    <i class="pi pi-spin pi-spinner text-3xl"></i>
  </div>

  <div *ngIf="!loading() && agenda() as a" class="max-w-lg flex flex-col gap-6">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-surface-50 dark:bg-surface-800 rounded-xl p-4">
        <label class="block font-bold mb-2 text-sm">Activity Points Target</label>
        <p-inputNumber [(ngModel)]="a.activityPointTarget" [min]="0" fluid />
      </div>
      <div class="bg-surface-50 dark:bg-surface-800 rounded-xl p-4">
        <label class="block font-bold mb-2 text-sm">Flashcard Target</label>
        <p-inputNumber [(ngModel)]="a.flashcardTarget" [min]="0" fluid />
      </div>
      <div class="bg-surface-50 dark:bg-surface-800 rounded-xl p-4">
        <label class="block font-bold mb-2 text-sm">Listening Episodes Target</label>
        <p-inputNumber [(ngModel)]="a.listeningEpisodeTarget" [min]="0" fluid />
      </div>
    </div>

    <div>
      <label class="block font-bold mb-2">Notes</label>
      <textarea pTextarea [(ngModel)]="a.notes"
        placeholder="Notes about this student's agenda..."
        rows="4" fluid></textarea>
    </div>

    <p-button label="Save Agenda" icon="pi pi-save"
      [loading]="saving()" (onClick)="save()" />
  </div>
</div>
