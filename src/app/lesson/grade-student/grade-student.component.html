<p-toast />
<p-confirmDialog />

<div *ngIf="!activeStudent()" class="card text-center py-16">
  <i class="pi pi-user text-5xl text-muted-color block mb-4"></i>
  <h3 class="text-xl font-semibold mb-2">No student selected</h3>
  <p-button label="Switch Client" icon="pi pi-users" (onClick)="goToSwitchClient()" />
</div>

<div *ngIf="activeStudent() as student" class="card">

  <div class="flex items-center gap-3 mb-6">
    <app-avatar 
      [username]="student.username" 
      [avatarUrl]="$any(student).avatarUrl" 
      customClass="w-10 h-10 text-base"
      fallbackBgClass="bg-primary text-white" />

    <div class="flex-1">
      <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Grade Student</h2>
      <p class="text-muted-color mt-0.5 m-0">{{ student.username }}</p>
    </div>
    <p-button label="Switch" icon="pi pi-arrows-h" severity="secondary" outlined
      size="small" (onClick)="goToSwitchClient()" />
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <div class="bg-surface-50 dark:bg-surface-800 rounded-xl p-5">
      <h3 class="font-semibold text-surface-900 dark:text-surface-0 mb-4 m-0">Add Grade</h3>
      <div class="flex flex-col gap-4">

        <div>
          <label class="block font-bold mb-2">Category *</label>
          <p-select [options]="categories" optionLabel="label" optionValue="value"
            [ngModel]="category()" (ngModelChange)="category.set($event)"
            placeholder="Select category" fluid />
        </div>

        <div>
          <label class="block font-bold mb-2">Score (%) *</label>
          <p-inputNumber
            [ngModel]="percentage()" (ngModelChange)="percentage.set($event)"
            [min]="0" [max]="100" suffix="%" fluid />
          <small class="text-red-500"
            *ngIf="submitted && (percentage() < 0 || percentage() > 100)">
            Score must be between 0 and 100.
          </small>
        </div>

        <div>
          <label class="block font-bold mb-2">Notes</label>
          <input pInputText type="text"
            [ngModel]="notes()" (ngModelChange)="notes.set($event)"
            placeholder="Optional notes..." fluid />
        </div>

        <p-button label="Add grade" icon="pi pi-plus"
          [loading]="saving()" (onClick)="addGrade()" />
      </div>
    </div>

    <div>
      <h3 class="font-semibold text-surface-900 dark:text-surface-0 mb-4 m-0">
        Grade History
        <span class="ml-2 text-sm font-normal text-muted-color">({{ grades().length }})</span>
      </h3>

      <div *ngIf="loading()" class="text-center py-10 text-muted-color">
        <i class="pi pi-spin pi-spinner text-3xl"></i>
      </div>

      <div *ngIf="!loading()" class="flex flex-col gap-2">
        <div *ngFor="let g of grades()"
          class="flex items-center gap-3 p-3 bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl">
          <p-tag [severity]="gradeSeverity(g.percentage)" [value]="g.percentage + '%'"
            styleClass="text-base font-bold" />
          <div class="flex-1">
            <div class="font-semibold text-surface-900 dark:text-surface-0">{{ g.category }}</div>
            <div class="text-xs text-muted-color">
              {{ g.gradeDate | date:'d MMM yyyy' }}
              <span *ngIf="g.notes"> · {{ g.notes }}</span>
            </div>
          </div>
          <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
            size="small" (onClick)="confirmRemove(g)" />
        </div>

        <div *ngIf="!grades().length" class="text-center py-8 text-muted-color">
          <i class="pi pi-star text-3xl block mb-2"></i>
          No grades yet.
        </div>
      </div>
    </div>

  </div>
</div>
