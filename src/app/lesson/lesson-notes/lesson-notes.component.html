<p-toast />
<p-confirmDialog />

<div *ngIf="!activeStudent()" class="card text-center py-16">
  <i class="pi pi-user text-5xl text-muted-color block mb-4"></i>
  <h3 class="text-xl font-semibold mb-2">No student selected</h3>
  <p-button label="Switch Client" icon="pi pi-users" (onClick)="goToSwitchClient()" />
</div>

<div *ngIf="activeStudent() as student" class="card">

  <div class="flex items-center gap-3 mb-6">
    <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold flex-shrink-0">
      {{ student.username[0]?.toUpperCase() }}
    </div>
    <div class="flex-1">
      <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Notes</h2>
      <p class="text-muted-color mt-0.5 m-0">{{ student.username }}</p>
    </div>
    <p-button label="Switch" icon="pi pi-arrows-h" severity="secondary" outlined
      size="small" (onClick)="goToSwitchClient()" />
  </div>

  <!-- New note -->
  <div class="bg-surface-50 dark:bg-surface-800 rounded-xl p-5 mb-6">
    <label class="block font-bold mb-3">New note</label>
    <textarea pTextarea
      [ngModel]="newNote()" (ngModelChange)="newNote.set($event)"
      placeholder="Write a note about this student..."
      rows="4" fluid></textarea>
    <div class="flex justify-end mt-3">
      <p-button label="Save note" icon="pi pi-save"
        [loading]="saving()"
        [disabled]="!newNote().trim()"
        (onClick)="save()" />
    </div>
  </div>

  <!-- Notes list -->
  <div *ngIf="loading()" class="text-center py-10 text-muted-color">
    <i class="pi pi-spin pi-spinner text-3xl"></i>
  </div>

  <div *ngIf="!loading()" class="flex flex-col gap-3">
    <div *ngFor="let note of notes()"
      class="p-4 bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl">
      <div class="flex items-start justify-between gap-3">
        <div class="flex-1">
          <p class="text-surface-900 dark:text-surface-0 m-0 whitespace-pre-wrap">{{ note.content }}</p>
          <div class="text-xs text-muted-color mt-2">
            {{ note.noteDate | date:'d MMM yyyy' }}
          </div>
        </div>
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
          size="small" (onClick)="confirmDelete(note)" />
      </div>
    </div>

    <div *ngIf="!notes().length" class="text-center py-10 text-muted-color">
      <i class="pi pi-file-edit text-4xl block mb-3"></i>
      No notes yet for this student.
    </div>
  </div>
</div>
