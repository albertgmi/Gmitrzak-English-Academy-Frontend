<p-toast />
<p-confirmDialog />

<div *ngIf="!activeStudent()" class="card text-center py-16">
  <i class="pi pi-user text-5xl text-muted-color block mb-4"></i>
  <h3 class="text-xl font-semibold mb-2">No student selected</h3>
  <p-button label="Switch Client" icon="pi pi-users" (click)="goToSwitchClient()" />
</div>

<div *ngIf="activeStudent() as student" class="card">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <app-avatar [username]="student.username" [avatarUrl]="$any(student).avatarUrl"
      customClass="w-10 h-10 text-base" fallbackBgClass="bg-primary text-white" />
    <div class="flex-1">
      <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">
        Pronunciation
      </h2>
      <p class="text-muted-color mt-0.5 m-0">{{ student.username }} — view and edit pronunciation entries</p>
    </div>
    <p-button label="Switch" icon="pi pi-arrows-h" severity="secondary" outlined
      size="small" (click)="goToSwitchClient()" />
  </div>

  <!-- Table -->
  <p-table [value]="pronunciations()" [loading]="loading()" [paginator]="true" [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]" responsiveLayout="scroll"
    styleClass="p-datatable-striped">
    
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 30%">Word</th>
        <th style="width: 20%">Status</th>
        <th style="width: 15%">Sort Order</th>
        <th style="width: 20%">Current Session</th>
        <th style="width: 15%" class="text-center">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td class="font-semibold text-surface-900 dark:text-surface-0">{{ item.word }}</td>
        <td>
          <p-tag [value]="item.status" [severity]="statusSeverity(item.status)" />
        </td>
        <td>{{ item.sortOrder }}</td>
        <td>
          <span *ngIf="item.isInCurrentSession" class="text-green-600 font-medium flex items-center gap-1">
            <i class="pi pi-check-circle"></i> Active
          </span>
          <span *ngIf="!item.isInCurrentSession" class="text-muted-color">Inactive</span>
        </td>
        <td class="text-center">
          <div class="flex items-center justify-center gap-2">
            <p-button icon="pi pi-pencil" severity="warn" [rounded]="true" [text]="true"
              pTooltip="Edit Entry" (click)="openEdit(item)" />
            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
              pTooltip="Delete Entry" (click)="confirmDelete(item)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center py-8 text-muted-color">
          <i class="pi pi-microphone text-3xl block mb-2"></i>
          No pronunciation entries found for {{ student.username }}.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Edit Dialog -->
<p-dialog [visible]="!!editingEntry()" (visibleChange)="!$event ? editingEntry.set(null) : null"
  header="Edit Pronunciation Entry" [modal]="true" [style]="{ width: '440px' }">
  
  <ng-template pTemplate="content">
    <div *ngIf="editingEntry()" class="flex flex-col gap-4 pt-2">
      <div>
        <label class="block font-bold mb-1">Word</label>
        <input pInputText type="text" [ngModel]="editForm().word"
          (ngModelChange)="editForm.set({ word: $event, status: editForm().status, sortOrder: editForm().sortOrder, isInCurrentSession: editForm().isInCurrentSession })"
          class="w-full" />
      </div>

      <div>
        <label class="block font-bold mb-1">Status</label>
        <p-select [options]="statusOptions" optionLabel="label" optionValue="value"
          [ngModel]="editForm().status"
          (ngModelChange)="editForm.set({ word: editForm().word, status: $event, sortOrder: editForm().sortOrder, isInCurrentSession: editForm().isInCurrentSession })"
          styleClass="w-full"></p-select>
      </div>

      <div>
        <label class="block font-bold mb-1">Sort Order</label>
        <p-inputNumber [ngModel]="editForm().sortOrder"
          (ngModelChange)="editForm.set({ word: editForm().word, status: editForm().status, sortOrder: $event, isInCurrentSession: editForm().isInCurrentSession })"
          styleClass="w-full"></p-inputNumber>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <p-checkbox [binary]="true" [ngModel]="editForm().isInCurrentSession"
          (ngModelChange)="editForm.set({ word: editForm().word, status: editForm().status, sortOrder: editForm().sortOrder, isInCurrentSession: $event })"
          inputId="isInCurrentSession"></p-checkbox>
        <label for="isInCurrentSession" class="font-medium cursor-pointer">Include in Current Session</label>
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" outlined (click)="editingEntry.set(null)" />
    <p-button label="Save" icon="pi pi-check" [loading]="saving()" (click)="saveEdit()" />
  </ng-template>
</p-dialog>
