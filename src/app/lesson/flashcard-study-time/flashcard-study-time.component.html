<div class="card">
  <p-toolbar styleClass="mb-6">
    <ng-template #start>
      <span class="text-xl font-semibold">Student Study Logs Summary</span>
    </ng-template>
    <ng-template #end>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search students..." />
      </p-iconfield>
      <p-button icon="pi pi-refresh" severity="secondary" outlined class="ml-2"
        (onClick)="reload()" pTooltip="Refresh data" />
    </ng-template>
  </p-toolbar>

  <p-table #dt [value]="summaries() || []" dataKey="username"
    [loading]="isLoading()" [rows]="10" [paginator]="true"
    [globalFilterFields]="['username']" 
    [tableStyle]="{ 'min-width': '50rem' }" [rowHover]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} students"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 30]">

    <ng-template #header>
      <tr>
        <th pSortableColumn="username">Student Username <p-sortIcon field="username" /></th>
        <th pSortableColumn="totalTimeSpentSeconds">Total Time Spent <p-sortIcon field="totalTimeSpentSeconds" /></th>
        <th pSortableColumn="totalFlashcardsDone">Total Flashcards Done <p-sortIcon field="totalFlashcardsDone" /></th>
      </tr>
    </ng-template>

    <ng-template #body let-summary>
      <tr>
        <td>
          <span class="font-bold text-primary">
            {{ summary.username }}
          </span>
        </td>
        <td class="text-muted-color">
          <span *ngIf="summary.totalTimeSpentSeconds !== null; else blankValue">
            {{ summary.totalTimeSpentSeconds }} seconds
          </span>
        </td>
        <td class="text-muted-color">
          <span *ngIf="summary.totalFlashcardsDone !== null; else blankValue">
            {{ summary.totalFlashcardsDone }} pcs
          </span>
        </td>
      </tr>
    </ng-template>

    <ng-template #blankValue>
      <span class="font-semibold text-surface-400 dark:text-surface-500">—</span>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="text-center text-muted-color py-12">
          <i class="pi pi-users text-5xl block mb-3 opacity-20"></i>
          <span class="text-xl">No student statistics found</span>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
