<p-toast />
<p-confirmDialog />

<div *ngIf="!activeStudent()" class="card text-center py-16">
  <i class="pi pi-user text-5xl text-muted-color block mb-4"></i>
  <h3 class="text-xl font-semibold mb-2">No student selected</h3>
  <p-button label="Switch Client" icon="pi pi-users" (onClick)="goToSwitchClient()" />
</div>

<div *ngIf="activeStudent() as student" class="card">
  <div class="flex items-center gap-3 mb-6">
    <app-avatar 
      [username]="student.username" 
      [avatarUrl]="$any(student).avatarUrl" 
      customClass="w-10 h-10 text-base"
      fallbackBgClass="bg-primary text-white" />

    <div class="flex-1">
      <h2 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-0">Stream Entries</h2>
      <p class="text-muted-color mt-0.5 m-0">{{ student.username }}</p>
    </div>
    <p-button label="Switch" icon="pi pi-arrows-h" severity="secondary" outlined
      size="small" (onClick)="goToSwitchClient()" />
  </div>

  <div class="bg-surface-50 dark:bg-surface-800 rounded-xl p-5 mb-6">
    <h3 class="font-semibold mb-4 m-0">Add Stream Entry</h3>
    <div class="flex gap-3 flex-wrap">
      <input pInputText type="text"
        [ngModel]="newCommand()" (ngModelChange)="newCommand.set($event)"
        placeholder="Command..." class="flex-1" />
      <input pInputText type="text"
        [ngModel]="newPayload()" (ngModelChange)="newPayload.set($event)"
        placeholder="Payload (optional)..." class="flex-1" />
      <p-button label="Add" icon="pi pi-plus"
        [loading]="saving()" [disabled]="!newCommand().trim()"
        (onClick)="add()" />
    </div>
  </div>

  <p-table [value]="entries()" [loading]="loading()"
    [rows]="20" [paginator]="entries().length > 20"
    [rowHover]="true" [tableStyle]="{'min-width': '40rem'}">
    <ng-template #header>
      <tr>
        <th pSortableColumn="executedAt">Time <p-sortIcon field="executedAt" /></th>
        <th pSortableColumn="command">Command <p-sortIcon field="command" /></th>
        <th>Payload</th>
        <th style="width: 5rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-e>
      <tr>
        <td class="text-sm text-muted-color">{{ e.executedAt | date:'d MMM HH:mm' }}</td>
        <td class="font-semibold font-mono text-sm">{{ e.command }}</td>
        <td class="text-muted-color text-sm">{{ e.payload || '—' }}</td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
            size="small" (onClick)="confirmDelete(e)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="text-center text-muted-color py-8">No stream entries.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
